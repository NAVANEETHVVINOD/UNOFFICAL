<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Premium gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D"/>
      <stop offset="30%" style="stop-color:#FFEB3B"/>
      <stop offset="70%" style="stop-color:#FFD93D"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    
    <!-- Glossy overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.15" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>
  
  <!-- Glossy overlay -->
  <rect width="512" height="256" rx="115" ry="115" fill="url(#gloss)"/>
  
  <!-- Subtle pattern -->
  <g fill="#000" opacity="0.03">
    <circle cx="80" cy="80" r="40"/>
    <circle cx="432" cy="80" r="40"/>
    <circle cx="80" cy="432" r="40"/>
    <circle cx="432" cy="432" r="40"/>
  </g>
  
  <!-- Inner card with shadow -->
  <g filter="url(#shadow)">
    <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="#fff"/>
  </g>
  
  <!-- Inner card border -->
  <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="none" stroke="#1a1a1a" stroke-width="8"/>
  
  <!-- Bold L letter -->
  <text x="256" y="365" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="280" font-weight="900" text-anchor="middle" fill="#1a1a1a" filter="url(#innerShadow)">L</text>
  
  <!-- Accent bar -->
  <rect x="145" y="385" width="222" height="16" rx="8" fill="#1a1a1a"/>
  
  <!-- Decorative accent circle -->
  <circle cx="395" cy="135" r="28" fill="#1a1a1a"/>
  <circle cx="395" cy="135" r="14" fill="#FFE66D"/>
  
  <!-- Small accent dots -->
  <circle cx="117" cy="135" r="10" fill="#1a1a1a" opacity="0.2"/>
  <circle cx="117" cy="377" r="10" fill="#1a1a1a" opacity="0.2"/>
</svg>