<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient for depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE135"/>
      <stop offset="50%" style="stop-color:#FFEB3B"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  
  <!-- Inner border with rounded corners -->
  <rect x="16" y="16" width="480" height="480" rx="84" ry="84" fill="none" stroke="#000" stroke-width="6"/>
  
  <!-- Decorative corner dots -->
  <circle cx="70" cy="70" r="12" fill="#000" opacity="0.15"/>
  <circle cx="442" cy="70" r="12" fill="#000" opacity="0.15"/>
  <circle cx="70" cy="442" r="12" fill="#000" opacity="0.15"/>
  <circle cx="442" cy="442" r="12" fill="#000" opacity="0.15"/>
  
  <!-- Decorative dots pattern -->
  <g fill="#000" opacity="0.06">
    <circle cx="140" cy="100" r="6"/>
    <circle cx="200" cy="100" r="6"/>
    <circle cx="312" cy="100" r="6"/>
    <circle cx="372" cy="100" r="6"/>
    <circle cx="140" cy="412" r="6"/>
    <circle cx="200" cy="412" r="6"/>
    <circle cx="312" cy="412" r="6"/>
    <circle cx="372" cy="412" r="6"/>
  </g>
  
  <!-- Bold L with shadow effect -->
  <g filter="url(#shadow)">
    <text x="256" y="380" font-family="Arial Black, Impact, sans-serif" font-size="320" font-weight="900" text-anchor="middle" fill="#1a1a1a">L</text>
  </g>
  
  <!-- Accent underline with rounded ends -->
  <rect x="150" y="400" width="212" height="14" rx="7" fill="#000"/>
  
  <!-- Decorative accent dot -->
  <circle cx="390" cy="150" r="20" fill="#000"/>
  <circle cx="390" cy="150" r="10" fill="#FFE135"/>
</svg>